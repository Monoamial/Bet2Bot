# Build the game and deploy it to GitHub Pages on every push to main.
# The site is served at https://monoamial.github.io/Bet2Bot/ — hence the --base flag.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install
        working-directory: game
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python engine
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q
      - name: Test strategy and Academy policies
        working-directory: game
        run: npm test
      - name: Build (base = /Bet2Bot/)
        working-directory: game
        run: npm run build -- --base=/Bet2Bot/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
